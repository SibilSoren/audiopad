<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>AudioPad — Multi-track audio editor in the browser</title>
    <meta
      name="description"
      content="A browser-based multi-track audio editor built with React, TypeScript and the Web Audio API. Record, layer and mix tracks with waveform visualisation — no install required."
    />

    <!-- Open Graph: without these, every share on LinkedIn/Twitter/WhatsApp/Slack
         renders as a bare URL with no title, description or image. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://audio-pad.netlify.app/" />
    <meta property="og:site_name" content="AudioPad" />
    <meta property="og:title" content="AudioPad — Multi-track audio editor in the browser" />
    <meta
      property="og:description"
      content="A browser-based multi-track audio editor built with React, TypeScript and the Web Audio API. Record, layer and mix tracks with waveform visualisation — no install required."
    />
    <meta property="og:image" content="https://audio-pad.netlify.app/logo.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="AudioPad logo" />

    <!-- summary, not summary_large_image: logo.png is square (512x512), so a large
         card would letterbox it badly. -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="AudioPad — Multi-track audio editor in the browser" />
    <meta
      name="twitter:description"
      content="Built with React, TypeScript and the Web Audio API. Record, layer and mix tracks with waveform visualisation."
    />
    <meta name="twitter:image" content="https://audio-pad.netlify.app/logo.png" />

    <!-- Space Grotesk for the interface, Space Mono for numerals and labels.
         preconnect so the fonts are not blocked behind a fresh DNS lookup. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
